apiVersion: 1
datasources:
  - name: PostgreSQL
    # uid fijo: los tableros provisionados lo referencian por este id.
    uid: iot-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: iot
    user: iot
    secureJsonData:
      # Grafana interpola variables de entorno del contenedor al provisionar.
      password: "$POSTGRES_PASSWORD"
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: true
    isDefault: true
    editable: true