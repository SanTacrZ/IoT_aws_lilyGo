services:
  # Paso 1 del tutorial: API + Postgres, todo en tu PC, sin AWS.
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot-local-123
    volumes:
      - pgdata_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iot"]
      interval: 10s
      retries: 5
  api:
    build: ../backend
    restart: unless-stopped
    env_file: .env.local
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata_local:
