; ---------------------------------------------------------------------------
;  LilyGO T-Beam — nodo sensor del cultivo (IoT FIWARE)
;
;  El firmware activo vive en src/main.cpp (estructura estandar de PlatformIO).
;  Este entorno compila y sube el nodo LilyGo T-Beam real.
;
;  Estructura:
;   src/main.cpp   firmware del nodo (adaptado del que ya funcionaba)
;   src/calibracion.h  extremos medidos del sensor de suelo y modo calibracion
;   src/secrets.h  credenciales locales, ignoradas por git
;    src/secrets.h.example  plantilla para crear secrets.h
;
;  Verificar que compila:      pio run
;  Subir a la placa:           pio run -t upload --upload-port /dev/ttyACM0
;  Ver la salida por serial:   pio device monitor --port /dev/ttyACM0
;  Subir y ver a la vez:       pio run -t upload -t monitor --upload-port /dev/ttyACM0
;
; ---------------------------------------------------------------------------

[env:ttgo-t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
lib_deps =
	mikalhart/TinyGPSPlus@^1.1.0
build_flags =
	-D CORE_DEBUG_LEVEL=1
